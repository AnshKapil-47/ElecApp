services:
  postgres:
    image: postgres:18.3-bookworm
    container_name: elecsarthi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-es_test}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5321}:5432"
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory and require the mount at /var/lib/postgresql.
      - es_pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-es_test}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  es_pgdata:
    driver: local
