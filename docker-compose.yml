services:
  postgres:
    image: postgres:18-bookworm
    container_name: elecsarthi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elecsarthi_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ElecSarthiSecret2026!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - es_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elecsarthi-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elecsarthi-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-elecsarthi_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ElecSarthiSecret2026!}
      ELECSARTHI_JWT_SECRET: ${ELECSARTHI_JWT_SECRET:-9f82c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2}
      ELECSARTHI_SECURITY_ACTIVATION_PEPPER: ${ELECSARTHI_SECURITY_ACTIVATION_PEPPER:-prod-activation-pepper-93821039821}
    networks:
      - elecsarthi-net

volumes:
  es_pgdata:
    driver: local

networks:
  elecsarthi-net:
    driver: bridge
