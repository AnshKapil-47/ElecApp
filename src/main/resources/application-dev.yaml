spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5321/es_test
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: ElecSarthiDevHikariPool

logging:
  level:
    root: INFO
    com.elecsarthi: DEBUG
    org.springframework.security: INFO
