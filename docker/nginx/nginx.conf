user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Real Client IP Detection and Header Spoofing Resistance
    # Narrowed to trusted Docker bridge network CIDRs and local container loopback
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Distributed Rate Limiting Zones (Leaky Bucket / Token Bucket)
    # Zone 1: Auth endpoints (Login, Activation, Refresh) - strict limit per IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;

    # Zone 2: General API endpoints - per IP
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=120r/m;

    # Zone 3: Per-device ID rate limiting (Coarse DDoS Mitigation Only)
    limit_req_zone $http_x_device_id zone=device_limit:10m rate=60r/m;

    limit_req_status 429;

    upstream elecsarthi_backend {
        least_conn;
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP Server (Port 80): Health check probe allowed; all other traffic redirected to HTTPS
    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;

        # Health check probe allowed over plain HTTP for load balancer probes
        location /actuator/health {
            proxy_pass http://elecsarthi_backend/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect all other HTTP traffic to HTTPS (TLS termination Option B / Gateway)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server (Port 443): Primary Ingress Gateway
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Default body size limit for general APIs
        client_max_body_size 10M;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health check probe
        location /actuator/health {
            proxy_pass http://elecsarthi_backend/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth endpoints: Strict Rate Limiting
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://elecsarthi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dataset upload endpoint: 210MB payload allowance for large voter XLSX files
        location /api/v1/datasets/ {
            client_max_body_size 210M;
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://elecsarthi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
        }

        # General APIs
        location /api/v1/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://elecsarthi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger & OpenAPI docs
        location ~ ^/(swagger-ui|api-docs) {
            proxy_pass http://elecsarthi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
