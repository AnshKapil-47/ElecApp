user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Real Client IP Detection and Header Spoofing Resistance
    # Trust upstream Docker bridge networks, container gateway, and local proxy
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Distributed Rate Limiting Zones (Leaky Bucket / Token Bucket)
    # Primary Defense: Throttling by trusted client IP ($binary_remote_addr) is the authoritative gateway defense.
    # Zone 1: Auth endpoints (Login, Activation, Refresh) - strict limit per IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;

    # Zone 2: General API endpoints - per IP
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=120r/m;

    # Zone 3: Per-device ID rate limiting (Coarse DDoS Mitigation Only)
    # Security Note: $http_x_device_id is client-controlled and NOT an authenticated identity.
    # Gateway device throttling provides coarse rate protection; authoritative cryptographic verification
    # is performed in the backend via ECDSA P-256 signatures (DeviceService.validateSignedRequest).
    # Requests with empty/missing X-Device-Id bypass this zone without penalty.
    limit_req_zone $http_x_device_id zone=device_limit:10m rate=60r/m;

    # Architecture Note: In-memory limit_req_zone applies per NGINX worker/instance. For multi-replica gateway
    # deployments across clusters, a shared distributed state store (e.g. Redis with OpenResty or Envoy global
    # rate limit service) or L4 sticky IP hashing should be used.
    limit_req_status 429;

    upstream elecsarthi_backend {
        least_conn;
        server backend:8080 max_fails=3 fail_timeout=10s;
        # Additional replicas can be added dynamically:
        # server backend_2:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # Security Headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health check probe (bypasses rate limiter)
        location /actuator/health {
            proxy_pass http://elecsarthi_backend/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth endpoints: Strict Rate Limiting
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://elecsarthi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General APIs
        location /api/v1/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://elecsarthi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger & OpenAPI docs
        location ~ ^/(swagger-ui|api-docs) {
            proxy_pass http://elecsarthi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
